# ============================================================
# REII — Docker Compose (two services)
# ============================================================

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: reii:latest
    container_name: reii-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./output:/app/output
      - ./ia:/app/ia
    environment:
      - REII_ROOT_DIR=/app
      - REII_DATA_DIR=data
      - REII_OUTPUT_DIR=output
      - REII_MODELS_DIR=models
      - REII_DB_PATH=data/analisis_gramatical.json
      - REII_WORKFLOW_DB_PATH=data/workflow_data.json
      - REII_BEST_PARAMS_PATH=data/best_params.json
      - REII_DISCOURSE_STATE_PATH=data/discourse_state.json
      - REII_GRAMMAR_CONFIG_PATH=ia/0.json
      - REII_DISCOURSE_CONFIG_PATH=ia/1.json
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
    restart: unless-stopped
    command: >
      streamlit run src/reii/dashboard.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.fileWatcherType=none

  workflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: reii:latest
    container_name: reii-workflow
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./output:/app/output
      - ./ia:/app/ia
    environment:
      - REII_ROOT_DIR=/app
      - REII_DATA_DIR=data
      - REII_OUTPUT_DIR=output
      - REII_MODELS_DIR=models
      - REII_DB_PATH=data/analisis_gramatical.json
      - REII_WORKFLOW_DB_PATH=data/workflow_data.json
      - REII_BEST_PARAMS_PATH=data/best_params.json
      - REII_DISCOURSE_STATE_PATH=data/discourse_state.json
      - REII_GRAMMAR_CONFIG_PATH=ia/0.json
      - REII_DISCOURSE_CONFIG_PATH=ia/1.json
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
    profiles: ["batch"]
    command: python src/reii/main_workflow_clasico.py
