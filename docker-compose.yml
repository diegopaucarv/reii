# ============================================================
# REII — Docker Compose (two services)
# ============================================================

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: reii:latest
    container_name: reii-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./output:/app/output
      - ./ia:/app/ia
    environment:
      - REII_ROOT_DIR=/app
      - REII_DATA_DIR=data
      - REII_OUTPUT_DIR=output
      - REII_MODELS_DIR=models
      - REII_DB_PATH=data/analisis_gramatical.json
      - REII_WORKFLOW_DB_PATH=data/workflow_data.json
      - REII_BEST_PARAMS_PATH=data/best_params.json
      - REII_DISCOURSE_STATE_PATH=data/discourse_state.json
      - REII_GRAMMAR_CONFIG_PATH=ia/analisis_discursivo/resumidor_gramatical.json
      - REII_DISCOURSE_CONFIG_PATH=ia/analisis_discursivo/discurso_lexico.json
      - REII_BATCH_DB_PATH=data/entrevistas.json
      - REII_TRANSCRIPTS_DIR=data/entrevistas
      - REII_DATABASE_URL=postgresql://reii:reii@reii-db:5432/reii
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - TOGETHER_API_URL=${TOGETHER_API_URL:-https://api.together.ai/v1/chat/completions}
      - REII_LLM_MODEL=${REII_LLM_MODEL:-deepseek-ai/DeepSeek-V4.1-Flash}
      - REII_LLM_FALLBACK_MODEL=${REII_LLM_FALLBACK_MODEL:-Prism-ML/Ternary-Bonsai-27B}
      - REII_LLM_MAX_RETRIES=${REII_LLM_MAX_RETRIES:-5}
      - REII_LLM_TIMEOUT=${REII_LLM_TIMEOUT:-300}
      - HF_TOKEN=${HF_TOKEN:-}
      - REII_CODE_VERSION=${REII_CODE_VERSION:-}
    restart: unless-stopped
    depends_on:
      reii-db:
        condition: service_healthy
    command: >
      streamlit run src/reii/dashboard.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.fileWatcherType=none

  workflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: reii:latest
    container_name: reii-workflow
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./output:/app/output
      - ./ia:/app/ia
      - ./scripts:/app/scripts:ro
      - D:/SUBTLEX-ESP.xlsx:/d/SUBTLEX-ESP.xlsx:ro
      - D:/cc.es.300.bin:/d/cc.es.300.bin:ro
      - D:/Python/HF_Cache:/root/.cache/huggingface
    environment:
      - REII_ROOT_DIR=/app
      - REII_DATA_DIR=data
      - REII_OUTPUT_DIR=output
      - REII_MODELS_DIR=models
      - REII_DB_PATH=data/analisis_gramatical.json
      - REII_WORKFLOW_DB_PATH=data/workflow_data.json
      - REII_BEST_PARAMS_PATH=data/best_params.json
      - REII_DISCOURSE_STATE_PATH=data/discourse_state.json
      - REII_GRAMMAR_CONFIG_PATH=ia/analisis_discursivo/resumidor_gramatical.json
      - REII_DISCOURSE_CONFIG_PATH=ia/analisis_discursivo/discurso_lexico.json
      - REII_BATCH_DB_PATH=data/entrevistas.json
      - REII_TRANSCRIPTS_DIR=data/entrevistas
      - REII_DATABASE_URL=postgresql://reii:reii@reii-db:5432/reii
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - TOGETHER_API_URL=${TOGETHER_API_URL:-https://api.together.ai/v1/chat/completions}
      - REII_LLM_MODEL=${REII_LLM_MODEL:-deepseek-ai/DeepSeek-V4.1-Flash}
      - REII_LLM_FALLBACK_MODEL=${REII_LLM_FALLBACK_MODEL:-Prism-ML/Ternary-Bonsai-27B}
      - REII_LLM_MAX_RETRIES=${REII_LLM_MAX_RETRIES:-5}
      - REII_LLM_TIMEOUT=${REII_LLM_TIMEOUT:-300}
      - REII_SUBTLEX_PATH=/d/SUBTLEX-ESP.xlsx
      - REII_WORD_EMBEDDINGS_PATH=/d/cc.es.300.bin
      - REII_USE_GENSIM_EMBEDDINGS=false
      # Sin DNS en el contenedor: hub/sentence-transformers resuelven desde
      # el volumen D:/Python/HF_Cache en vez de intentar la red (y fallar
      # tras N reintentos). Poner HF_HUB_OFFLINE=0 en el .env para re-habilitar.
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - HF_TOKEN=${HF_TOKEN:-}
      - REII_CODE_VERSION=${REII_CODE_VERSION:-}
      - STANZA_SERVER_URL=${STANZA_SERVER_URL:-}
      - STANZA_SERVER_TOKEN=${STANZA_SERVER_TOKEN:-}
      - STANZA_SERVER_TIMEOUT=${STANZA_SERVER_TIMEOUT:-90}
      - STANZA_SERVER_FALLBACK_LOCAL=${STANZA_SERVER_FALLBACK_LOCAL:-true}
      - REII_ROOTS_SKIP_COREF=${REII_ROOTS_SKIP_COREF:-true}
      - REII_ROOTS_BATCH_SIZE=${REII_ROOTS_BATCH_SIZE:-32}
      - REII_COREF_BATCH_SIZE=${REII_COREF_BATCH_SIZE:-1}
      # Workers de sklearn en RobustRFShapAnalyzer. -1 (todos los núcleos)
      # lanza un proceso loky por CPU y agota la RAM de la VM de Docker
      # Desktop/WSL2 durante el tuning del RF (la daemon muere con
      # "error waiting for container: unexpected EOF"). 1 = secuencial.
      - REII_RF_N_JOBS=${REII_RF_N_JOBS:-1}
    # /dev/shm por defecto son 64MB en Docker y torch/joblib lo usan.
    shm_size: 2gb
    profiles: ["batch"]
    depends_on:
      reii-db:
        condition: service_healthy
    command: python src/reii/main_workflow.py

  reii-db:
    image: postgres:16
    container_name: reii-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=reii
      - POSTGRES_PASSWORD=reii
      - POSTGRES_DB=reii
    volumes:
      - reii_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reii -d reii"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  reii_pgdata:
