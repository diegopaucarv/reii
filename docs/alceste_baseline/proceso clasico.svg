<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1192px" preserveAspectRatio="none" style="width:522px;height:1192px;background:#FFFFFF;" version="1.1" viewBox="0 0 522 1192" width="522px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="272" x="123.5" y="32.9951">Proceso clásico (Reinert/ALCESTE)</text><ellipse cx="261" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#EAF3FB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="177" x="172.5" y="87.2969"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="157" x="182.5" y="108.4355">Corpus de entrevistas</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="157" x="182.5" y="122.4043">Transcripción literal (UCI)</text><rect fill="#EAF3FB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="278" x="122" y="155.2344"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="258" x="132" y="176.373">Exclusión de preguntas del entrevistador</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="173" x="132" y="190.3418">y sección sociodemográfica</text><rect fill="#EAF3FB" height="61.9063" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="208" x="157" y="223.1719"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="110" x="167" y="244.3105">Segmentación en</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="27" x="281" y="244.3105">UCE</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="149" x="167" y="258.2793">(ventana fija de tokens,</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="188" x="167" y="272.248">puntuación como delimitador)</text><rect fill="#EAF3FB" height="61.9063" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="217" x="152.5" y="305.0781"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="91" x="162.5" y="326.2168">Agrupación en</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="19" x="257.5" y="326.2168">UC</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="197" x="162.5" y="340.1855">(umbral numérico fijo de lemas,</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="191" x="162.5" y="354.1543">e.g., ≥10 lemas de contenido)</text><rect fill="#EAF3FB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="313" x="104.5" y="386.9844"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="102" x="114.5" y="408.123">Construcción de</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="93" x="220.5" y="408.123">matriz densa</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="90" x="317.5" y="408.123">UC × términos</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="159" x="114.5" y="422.0918">(binarización de conteos)</text><rect fill="#EAF3FB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="266" x="128" y="454.9219"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="71" x="138" y="476.0605">Iteración 1:</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="26" x="213" y="476.0605">AFC</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="141" x="243" y="476.0605">(promedios recíprocos</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="220" x="138" y="490.0293">de Benzécri) sobre matriz completa</text><rect fill="#EAF3FB" height="61.9063" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="263" x="129.5" y="522.8594"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="23" x="139.5" y="543.998">CJD</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="141" x="166.5" y="543.998">- División binaria inicial</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="243" x="139.5" y="557.9668">(búsqueda de corte k + swap k-means</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="221" x="139.5" y="571.9355">hasta maximizar inercia inter-clase)</text><rect fill="#EAF3FB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="278" x="122" y="604.7656"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="145" x="132" y="625.9043">Verificación estadística</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="258" x="132" y="639.873">(test chi-cuadrado; clases ≥5% del total)</text><rect fill="#EAF3FB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="304" x="109" y="672.7031"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="284" x="119" y="693.8418">Repetición recursiva sobre cada subconjunto</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="10" x="119" y="707.8105">→</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="214" x="133" y="707.8105">árbol binario de clases léxicas</text><rect fill="#EAF3FB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="248" x="137" y="740.6406"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="165" x="147" y="761.7793">Iteración 2: repetición con</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="115" x="147" y="775.748">segundo umbral</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="109" x="266" y="775.748">(e.g., ≥14 lemas)</text><polygon fill="#FFF3CD" points="207.5,808.5781,314.5,808.5781,326.5,821.3828,314.5,834.1875,207.5,834.1875,195.5,821.3828,207.5,808.5781" style="stroke:#856404;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="105" x="207.5" y="818.7886">"¿Árbol 1 y Árbol 2</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="107" x="207.5" y="831.5933">son congruentes?"</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="11" x="184.5" y="818.7886">Sí</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="47" x="326.5" y="818.7886">Revisión</text><rect fill="#EAF3FB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="240" x="11" y="844.1875"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="130" x="21" y="865.3262">Clases consideradas</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="62" x="155" y="865.3262">estables</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="220" x="21" y="879.2949">(evaluación visual del investigador)</text><rect fill="#EAF3FB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="179" x="301.5" y="844.1875"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="159" x="311.5" y="865.3262">Ajuste manual del umbral</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="87" x="311.5" y="879.2949">y re-ejecución</text><rect fill="#EAF3FB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="240" x="271" y="912.125"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="130" x="281" y="933.2637">Clases consideradas</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="62" x="415" y="933.2637">estables</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="220" x="281" y="947.2324">(evaluación visual del investigador)</text><polygon fill="#FFF3CD" points="261,966.0625,273,978.0625,261,990.0625,249,978.0625,261,966.0625" style="stroke:#856404;stroke-width:0.5;"/><rect fill="#EAF3FB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="261" x="130.5" y="1010.0625"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="65" x="140.5" y="1031.2012">Cálculo de</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="172" x="209.5" y="1031.2012">términos característicos</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="185" x="140.5" y="1045.1699">por clase (χ², φ, C de Reinert)</text><rect fill="#EAF3FB" height="61.9063" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="284" x="119" y="1078"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="115" x="129" y="1099.1387">Análisis cualitativo</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="52" x="248" y="1099.1387">manual</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="191" x="129" y="1113.1074">(metáforas, temas, jerarquías,</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="264" x="129" y="1127.0762">oposiciones → representaciones sociales)</text><ellipse cx="261" cy="1170.9063" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="261" cy="1170.9063" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="261" x2="261" y1="67.2969" y2="87.2969"/><polygon fill="#444444" points="257,77.2969,261,87.2969,265,77.2969,261,81.2969" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="261" x2="261" y1="135.2344" y2="155.2344"/><polygon fill="#444444" points="257,145.2344,261,155.2344,265,145.2344,261,149.2344" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="261" x2="261" y1="203.1719" y2="223.1719"/><polygon fill="#444444" points="257,213.1719,261,223.1719,265,213.1719,261,217.1719" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="261" x2="261" y1="285.0781" y2="305.0781"/><polygon fill="#444444" points="257,295.0781,261,305.0781,265,295.0781,261,299.0781" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="261" x2="261" y1="366.9844" y2="386.9844"/><polygon fill="#444444" points="257,376.9844,261,386.9844,265,376.9844,261,380.9844" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="261" x2="261" y1="434.9219" y2="454.9219"/><polygon fill="#444444" points="257,444.9219,261,454.9219,265,444.92