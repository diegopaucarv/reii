[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reii"
version = "1.0.0"
description = "ALCESTE-style Spanish discourse analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "REII Team" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reii = ["**/*.joblib", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
